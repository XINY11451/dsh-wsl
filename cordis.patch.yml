# This bundle layer inserts the wsl tool plugin process-wide, so every agent
# preset gets the `wsl`/`wsl-path`/`wsl-env` tools without declaring anything.
#
# Do NOT also add a `tool-wsl` row to a preset. DSH registers tools by name and
# the second registration fails with
# `tool "wsl" is already registered in this scope`. To keep the tools out of a
# composition, override this row by id in a later patch layer (`- id: tool-wsl`
# with `disabled: true`) instead of duplicating it.

# The entry name is PATH-RELATIVE on purpose. DSH anchors a relative `name:` to
# the directory of the patch file that declared it (`anchorInsertedPluginNames`),
# so this row always loads this bundle's own `index.js` — whatever the package
# folder happens to be called. A bare package name would instead have to match
# the installed folder name, which couples this file to the npm package name:
# the registry refuses `dsh-wsl` as too similar to `is-wsl`, so the published
# name is `dsh-wsl-tool` while a local `file:` install may sit in
# `node_modules/dsh-wsl`. Keep this relative.

- insert:
    - id: tool-wsl
      name: './index.js'

# ── Sidebar terminal: a WSL shell, listed first and selected by default ────────
#
# The desktop app's 新建终端 list is built from the composed `terminal-controller`
# row: it discovers shells from `shellCandidates` and puts the configured `shell`
# first. Overriding that row here is what makes installing this plugin also give
# you a Linux terminal in the sidebar. (A candidate entry cannot do it: a shell
# discovered by name gets `-i` appended, and `wsl.exe -i` is a hard error.)
#
# The path is absolute because the configured shell must resolve, and a shell that
# cannot resolve makes every new terminal fail rather than just this one: wsl.exe
# ships with Windows at a fixed location, so this resolves even where no
# distribution is installed yet.
#
# No distro is pinned, so `wsl.exe` follows the system default — the same rule the
# tools use when DSH_WSL_DISTRO is unset. Add `-d <name>` to `args` to pin one.
#
# This changes the default terminal shell, which is deliberate for a WSL plugin
# and reversible: a later patch layer wins, so restating the row in a profile's own
# cordis.patch.yml overrides it (and a profile that sets its own `shell` there is
# unaffected by this row).
#
# An id-targeted patch replaces the whole config, so anything the layer below set
# on this row (limits, scrollback, a custom shellCandidates list) falls back to its
# schema default. Only `shell` is set here on purpose. Never add `disabled:` here:
# that would switch off the terminal feature for the user instead of just this row.
- id: terminal-controller
  config:
    shell:
      path: 'C:\Windows\System32\wsl.exe'
      name: WSL
      args: ['-e', 'bash', '-l']
