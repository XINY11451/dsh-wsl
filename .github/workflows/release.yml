name: release

# The plugin market installs this plugin from a FIXED asset URL:
#   https://github.com/XINY11451/dsh-wsl/releases/latest/download/dsh-wsl.tgz
# so a tagged version is only reachable to market users once a *release* exists
# whose asset carries exactly that file name. Nothing else publishes it.
#
# A tag also publishes to npm, which is what makes the catalog show a version and
# download count. That step is skipped until the NPM_TOKEN secret exists, so this
# workflow is safe to run before the npm account is set up.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the toolchain the plugin is developed against.
          node-version: '22'
          # Writes the registry and the token placeholder into the runner's
          # .npmrc, so `npm publish` authenticates from NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      # The behavioural suite needs Windows + WSL, so it cannot run here. These
      # gates can: syntax, and that the module actually imports — lib/ has no
      # dependencies outside the package, so a missing file or a broken relative
      # import fails the release instead of shipping.
      - name: Gate — syntax and module load
        run: |
          set -euo pipefail
          node --check index.js
          for file in lib/*.js lib/tools/*.js; do node --check "$file"; done
          node -e "
            import('./index.js').then((mod) => {
              if (typeof mod.apply !== 'function') throw new Error('apply is not exported');
              if (mod.name !== 'tool-wsl') throw new Error('unexpected plugin name: ' + mod.name);
              console.log('plugin module loads:', Object.keys(mod).sort().join(', '));
            });
          "

      - name: Build the tarball
        run: |
          set -euo pipefail
          npm pack
          # The market URL is fixed on `dsh-wsl.tgz`; `npm pack` names the file
          # after the version, so keep a copy under that name for the release
          # asset and publish the version-named one to npm.
          cp dsh-wsl-*.tgz dsh-wsl.tgz
          tar -tzf dsh-wsl.tgz
          ls -l dsh-wsl.tgz dsh-wsl-*.tgz

      # The market asset is the critical path — it is what the catalog installs
      # from — so it goes FIRST. A publishing failure below then fails the run
      # loudly without withholding the release.
      - name: Publish the GitHub release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dsh-wsl.tgz --clobber
          else
            gh release create "$tag" dsh-wsl.tgz --title "$tag" --generate-notes --latest
          fi

      # `package.json` pins `publishConfig.registry`, so this cannot be sent to a
      # read-only mirror by a developer's local .npmrc. Publishing needs a token
      # that may bypass 2FA: an interactive login cannot answer an OTP prompt
      # from an unattended run (npm answers 403 in that case).
      #
      # Failures here are reported through `::error::`, which GitHub records as a
      # check annotation — readable from the public API without repository
      # access, unlike the job log. That is deliberate: this step is the only
      # part of the pipeline that needs a credential, so when it breaks the
      # reason has to be legible without asking a human to copy it out.
      - name: Publish to npm (skipped until NPM_TOKEN exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured — skipping the npm publish."
            echo "::notice::NPM_TOKEN is not set; the npm publish was skipped."
            exit 0
          fi

          echo "registry: $(npm config get registry)"
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::npm whoami rejected the token: $(echo "$who" | head -c 300)"
            exit 1
          fi
          echo "authenticated as: ${who}"
          echo "::notice::npm token authenticates as ${who}"

          if ! output="$(npm publish ./dsh-wsl-*.tgz 2>&1)"; then
            echo "$output"
            reason="$(echo "$output" | grep -m1 'npm error' | tr -d '\r' | head -c 300)"
            echo "::error::npm publish failed: ${reason:-see the log}"
            exit 1
          fi
          echo "$output"
          echo "::notice::published $(node -p "require('./package.json').version") to npm"
